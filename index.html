<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Vocabulary Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2a41;
    --muted: #5b6678;
    --paper: #f6f8fb;
    --surface: #ffffff;
    --line: #d9e0ea;
    --accent: #0e7c6b;
    --accent-ink: #ffffff;
    --mark: #ffe08a;
    --new: #8a94a6;
    --practicing: #b7791f;
    --learned: #0e7c6b;
    --bad: #b3261e;
    --good-bg: #dff3ee;
    --bad-bg: #fbe3e1;
    --head: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8edf5;
      --muted: #9aa6b8;
      --paper: #11171f;
      --surface: #19212c;
      --line: #2b3646;
      --accent: #3cc2ad;
      --accent-ink: #08201b;
      --mark: #6b5a1c;
      --new: #8a94a6;
      --practicing: #e0a84a;
      --learned: #3cc2ad;
      --bad: #ff8a80;
      --good-bg: #17382f;
      --bad-bg: #44211f;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px max(16px, env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  button { font-family: var(--head); color: var(--ink); }
  button:focus-visible, textarea:focus-visible, input:focus-visible, .flip:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- header and stats ---------- */
  h1 {
    font-family: var(--head); font-weight: 700;
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.02em;
  }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    font-family: var(--head); font-weight: 500; font-size: .95rem;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 99px; padding: 6px 14px;
  }
  .stat b { font-weight: 700; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }

  /* ---------- calendar (small week strip) ---------- */
  .cal {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
  }
  .cal-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .cal-top h2 { font-family: var(--head); font-size: 1rem; font-weight: 700; margin: 0 0 0 4px; }
  .cal-top .acts { display: flex; gap: 6px; }
  .pill {
    font-family: var(--head); font-size: .85rem; font-weight: 500;
    padding: 6px 12px; min-height: 36px;
    border: 1px solid var(--line); border-radius: 99px;
    background: transparent; cursor: pointer;
  }
  .pill[aria-pressed="true"], .pill[aria-expanded="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pill:disabled { opacity: .45; cursor: default; }

  .strip { display: flex; gap: 4px; align-items: stretch; }
  .strip .nav {
    width: 30px; flex: none;
    border: 0; background: transparent; font-size: 1.1rem; cursor: pointer; border-radius: 8px;
  }
  .d {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 0 10px; position: relative;
    border: 1px solid transparent; border-radius: 10px;
    background: transparent; cursor: pointer;
    color: var(--muted);
  }
  .d small { font-size: .7rem; line-height: 1.2; }
  .d b { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .d.has { background: var(--paper); border-color: var(--line); color: var(--ink); }
  .d.has::after {
    content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .d.today { border-color: var(--accent); }
  .d[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .d[aria-pressed="true"].has::after { background: var(--mark); }

  .month { margin-top: 10px; max-width: 320px; margin-left: auto; margin-right: auto; }
  .month[hidden] { display: none; }
  .month-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .month-head span { font-family: var(--head); font-weight: 700; font-size: .95rem; }
  .month-head button { width: 32px; height: 32px; border: 1px solid var(--line); background: transparent; border-radius: 8px; cursor: pointer; }
  .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .mgrid .dow { text-align: center; font-family: var(--head); font-size: .7rem; color: var(--muted); }
  .mgrid .m {
    height: 36px; position: relative;
    font-family: var(--head); font-size: .85rem;
    border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .mgrid .m.has { color: var(--ink); background: var(--paper); border-color: var(--line); }
  .mgrid .m.has::after { content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .mgrid .m.today { border-color: var(--accent); }
  .mgrid .m[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---------- tabs ---------- */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 16px; }
  .tabs button {
    font-weight: 700; font-size: .95rem; min-height: 44px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .scope { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; font-family: var(--head); font-weight: 500; color: var(--muted); flex-wrap: wrap; }
  .badge-new {
    font-size: .8rem; font-weight: 700; color: var(--ink);
    background: var(--mark); border-radius: 99px; padding: 2px 10px;
  }

  /* ---------- flashcards ---------- */
  .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .dots i { width: 22px; height: 6px; border-radius: 99px; background: var(--line); }
  .dots i.cur { background: var(--ink); }
  .dots i.l { background: var(--learned); }
  .dots i.p { background: var(--practicing); }

  .flip { perspective: 1200px; cursor: pointer; border-radius: 16px; }
  .inner { display: grid; transition: transform .5s; transform-style: preserve-3d; }
  .flip.flipped .inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    min-height: 270px; padding: 26px 22px;
    background: var(--surface);
    border: 1px solid var(--line); border-top: 8px solid var(--new);
    border-radius: 16px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  }
  .flip[data-status="Practicing"] .face { border-top-color: var(--practicing); }
  .flip[data-status="Learned"] .face { border-top-color: var(--learned); }
  .back { transform: rotateY(180deg); align-items: flex-start; text-align: left; }
  .bigword {
    font-family: var(--head); font-weight: 700;
    font-size: clamp(2.1rem, 10vw, 3.2rem); line-height: 1.15; letter-spacing: -0.02em;
    background: linear-gradient(transparent 62%, var(--mark) 62%);
    padding: 0 4px;
  }
  .ptype { color: var(--muted); font-style: italic; margin-top: 8px; }
  .hint { color: var(--muted); font-family: var(--head); font-size: .85rem; margin-top: 22px; }
  .badge-pop {
    font-family: var(--head); font-weight: 700; font-size: .8rem;
    background: var(--mark); color: #1b2a41; border-radius: 99px; padding: 2px 12px; margin-bottom: 14px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .back p { margin: 0 0 12px; }
  .back b { display: block; font-family: var(--head); font-weight: 500; font-size: .8rem; color: var(--muted); }
  .eg { font-style: italic; }

  .controls { display: flex; gap: 8px; margin-top: 14px; }
  .controls .btn { flex: 1; }
  .btn {
    font-weight: 700; font-size: .95rem; min-height: 46px; padding: 8px 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.warn { border-color: var(--practicing); }
  .btn:disabled { opacity: .4; cursor: default; }
  .mini { flex: none !important; width: 52px; }

  .done { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 20px; }
  .done h3 { font-family: var(--head); font-size: 1.5rem; margin: 0 0 6px; }
  .done p { margin: 0 0 18px; color: var(--muted); }
  .done .controls { justify-content: center; }

  /* ---------- list ---------- */
  .lt { display: grid; gap: 8px; margin-bottom: 6px; }
  .lt input[type="search"] {
    font: inherit; font-size: 1rem; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink);
  }
  .chips { display: flex; gap: 6px; }
  .chips .pill { flex: 1; min-height: 40px; }
  .word {
    background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--new);
    border-radius: 8px; padding: 16px; margin-top: 12px;
  }
  .word[data-status="Practicing"] { border-left-color: var(--practicing); }
  .word[data-status="Learned"] { border-left-color: var(--learned); }
  .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .w {
    font-family: var(--head); font-weight: 700; font-size: 1.5rem; line-height: 1.2;
    background: linear-gradient(transparent 62%, var(--mark) 62%); padding: 0 2px;
  }
  .type { color: var(--muted); font-style: italic; margin-left: 8px; font-size: .95rem; }
  .say {
    font-size: .85rem; border: 1px solid var(--line); background: transparent;
    border-radius: 10px; padding: 8px 12px; min-height: 40px; cursor: pointer;
  }
  .detail p { margin: 6px 0; }
  .detail b { font-family: var(--head); font-weight: 500; color: var(--muted); font-size: .8rem; display: block; }
  label.mine { display: block; margin-top: 12px; font-family: var(--head); font-size: .85rem; color: var(--muted); }
  textarea {
    width: 100%; margin-top: 4px; min-height: 64px; resize: vertical;
    font: inherit; font-size: 1rem; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  .status { display: flex; gap: 6px; margin-top: 12px; }
  .status button {
    flex: 1; font-size: .85rem; font-weight: 500; padding: 10px 6px; border-radius: 99px;
    border: 1px solid var(--line); background: transparent; cursor: pointer;
  }
  .status button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* ---------- quiz ---------- */
  .q { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; }
  .q small { font-family: var(--head); color: var(--muted); }
  .q h3 { font-family: var(--head); font-size: 1.25rem; line-height: 1.35; margin: 6px 0 16px; }
  .opts { display: grid; gap: 8px; }
  .opt {
    text-align: left; font-weight: 500; font-size: 1rem; min-height: 48px; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--paper); cursor: pointer;
  }
  .opt.right { background: var(--good-bg); border-color: var(--learned); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .opt:disabled { cursor: default; }
  .fb { margin: 14px 0 0; font-family: var(--head); font-weight: 500; }
  .fb.ok { color: var(--learned); }
  .fb.no { color: var(--bad); }
  .q .controls { margin-top: 14px; }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  /* ---------- toast and confetti ---------- */
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--paper);
    font-family: var(--head); font-weight: 500;
    padding: 10px 18px; border-radius: 99px; z-index: 60;
    transition: opacity .25s, transform .25s; max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .inner, .bar > span, #toast { transition: none; }
    .badge-pop { animation: none; }
  }
  @media (max-width: 400px) {
    body { font-size: 17px; }
    .stat { font-size: .85rem; padding: 5px 10px; }
    .d b { font-size: .95rem; }
    .strip .nav { width: 24px; }
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<div class="wrap">
  <header>
    <h1>My Vocabulary Book</h1>
    <div class="stats">
      <span class="stat" id="stStreak"></span>
      <span class="stat" id="stPoints"></span>
      <span class="stat" id="stLearned"></span>
    </div>
    <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  </header>

  <section class="cal" aria-label="Calendar">
    <div class="cal-top">
      <h2 id="calTitle"></h2>
      <div class="acts">
        <button type="button" class="pill" id="allBtn">All days</button>
        <button type="button" class="pill" id="monthBtn" aria-expanded="false">Month</button>
      </div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="month" id="month" hidden>
      <div class="month-head">
        <button type="button" id="prevM" aria-label="Previous month">&lt;</button>
        <span id="monthTitle"></span>
        <button type="button" id="nextM" aria-label="Next month">&gt;</button>
      </div>
      <div class="mgrid" id="mgrid"></div>
    </div>
  </section>

  <div class="tabs" role="group" aria-label="Choose how to study">
    <button type="button" data-mode="cards" aria-pressed="true">Flashcards</button>
    <button type="button" data-mode="quiz" aria-pressed="false">Quiz</button>
    <button type="button" data-mode="list" aria-pressed="false">List</button>
  </div>

  <div class="scope" id="scope"></div>
  <main id="panel"></main>
</div>

<script>
/* ------------------------------------------------------------------
   HOW TO ADD NEW WORDS EVERY DAY
   1. Ask Claude for today's words.
   2. Paste the new day block at the END of the DAYS list below.
   3. Upload the file to your website again.
   Your points, streak, sentences and status are saved in your
   browser, so they stay safe when you add new words.
------------------------------------------------------------------- */
const START_DATE = "2026-10-06";

const DAYS = [
  {
    day: 1,
    words: [
      { word: "Clarify", type: "verb",
        meaning: "To make something easy to understand.",
        example: "Let me clarify what I meant.",
        work: "Can I clarify the requirement before I start?" },
      { word: "Bottleneck", type: "noun",
        meaning: "The one slow part that slows down everything else.",
        example: "The traffic near the bridge is a bottleneck.",
        work: "The database query is the bottleneck in our API." },
      { word: "Mitigate", type: "verb",
        meaning: "To make a problem smaller or less serious.",
        example: "We added a backup to mitigate the risk.",
        work: "We used caching to mitigate the slow response time." },
      { word: "Straightforward", type: "adjective",
        meaning: "Easy, with no hard parts.",
        example: "The instructions were straightforward.",
        work: "The migration was straightforward." },
      { word: "Elaborate", type: "verb",
        meaning: "To give more details about something.",
        example: "Could you elaborate on that?",
        work: "Let me elaborate on how the retry logic works." }
    ]
  }
  /* ,{ day: 2, words: [ ... ] } */
];

/* ---------- saving (browser storage, safe if blocked) ---------- */
const KEY = "vocab-book-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function get(id) { return store[id] || { status: "New", mine: "", seen: false }; }
function touch() {
  const k = keyOf(new Date());
  if (!Array.isArray(store.__days)) store.__days = [];
  if (store.__days.indexOf(k) === -1) store.__days.push(k);
  save();
}
function set(id, patch) {
  store[id] = Object.assign({}, get(id), patch);
  touch();
}

/* ---------- small helpers ---------- */
function el(tag, attrs, text) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}
function keyOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function startDate() { return new Date(START_DATE + "T00:00:00"); }
function dateOfDay(day) { const d = startDate(); d.setDate(d.getDate() + day - 1); return d; }
function keyForDay(day) { return keyOf(dateOfDay(day)); }
function dateFor(day) { return dateOfDay(day).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
function daysByDate() { const m = {}; DAYS.forEach(d => { m[keyForDay(d.day)] = d; }); return m; }
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function reduceMotion() { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1800);
}

function confetti(n) {
  if (reduceMotion()) return;
  const c = document.getElementById("fx");
  const ctx = c.getContext("2d");
  c.width = window.innerWidth; c.height = window.innerHeight;
  const colors = ["#0e7c6b", "#ffd166", "#ef476f", "#118ab2", "#8338ec"];
  const parts = [];
  for (let i = 0; i < (n || 70); i++) {
    parts.push({
      x: c.width / 2 + (Math.random() - .5) * 140, y: c.height * 0.6,
      vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 4,
      s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => {
      p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .6);
      ctx.restore();
    });
    frames++;
    if (frames < 95) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- state ---------- */
const todayKey = keyOf(new Date());
let selected = daysByDate()[todayKey] ? todayKey : null;   // open today's words first
let mode = "cards";
let deckIndex = 0, flipped = false;
let quiz = null;
let filter = "All", query = "";
let monthOpen = false;
const focusDate = (new Date() >= startDate()) ? new Date() : startDate();
let weekStart = weekStartOf(selected ? new Date(selected + "T00:00:00") : focusDate);
let viewYear = focusDate.getFullYear(), viewMonth = focusDate.getMonth();

function weekStartOf(d) {
  // weeks are counted from the start date (6 Oct), never before it
  const s0 = startDate();
  const day0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((day0 - s0) / 86400000);
  const w = Math.max(0, Math.floor(diff / 7));
  const x = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + w * 7);
  return x;
}
function allWords() {
  const out = [];
  DAYS.forEach(d => d.words.forEach(w => out.push({ day: d.day, w: w, id: d.day + "-" + w.word })));
  return out;
}
function scope() {
  return allWords().filter(i => !selected || keyForDay(i.day) === selected);
}

/* ---------- stats ---------- */
function streak() {
  const days = new Set(store.__days || []);
  const d = new Date();
  if (!days.has(keyOf(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(keyOf(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderStats() {
  let total = 0, learned = 0, pts = 0;
  allWords().forEach(i => {
    total++;
    const s = get(i.id);
    if (s.status === "Learned") { learned++; pts += 10; }
    else if (s.status === "Practicing") pts += 5;
    if (s.mine && s.mine.trim()) pts += 5;
  });
  const sk = streak();
  document.getElementById("stStreak").innerHTML = "\uD83D\uDD25 <b>" + sk + "</b> day streak";
  document.getElementById("stPoints").innerHTML = "\u2B50 <b>" + pts + "</b> points";
  document.getElementById("stLearned").innerHTML = "<b>" + learned + "</b> of " + total + " learned";
  document.getElementById("barFill").style.width = total ? (learned / total * 100) + "%" : "0";
}

/* ---------- calendar ---------- */
function pick(k, dt) {
  selected = (selected === k) ? null : k;
  if (selected) weekStart = weekStartOf(dt);
  deckIndex = 0; flipped = false; quiz = null;
  renderAll();
}
function renderCalendar() {
  const map = daysByDate();
  const mid = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 3);
  document.getElementById("calTitle").textContent = mid.toLocaleDateString("en-GB", { month: "long", year: "numeric" });

  const strip = document.getElementById("strip");
  strip.textContent = "";
  const prev = el("button", { type: "button", class: "nav", "aria-label": "Previous week" }, "\u2039");
  prev.disabled = weekStart <= startDate();
  prev.style.opacity = prev.disabled ? ".3" : "1";
  prev.addEventListener("click", () => { weekStart.setDate(weekStart.getDate() - 7); renderCalendar(); });
  strip.appendChild(prev);
  for (let i = 0; i < 7; i++) {
    const dt = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
    const k = keyOf(dt);
    const has = !!map[k];
    let cls = "d" + (has ? " has" : "") + (k === todayKey ? " today" : "");
    const b = el("button", {
      type: "button", class: cls, "aria-pressed": String(selected === k),
      "aria-label": dt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) + (has ? ", has words" : ", no words")
    });
    b.appendChild(el("small", null, dt.toLocaleDateString("en-GB", { weekday: "short" })));
    b.appendChild(el("b", null, String(dt.getDate())));
    b.addEventListener("click", () => pick(k, dt));
    strip.appendChild(b);
  }
  const next = el("button", { type: "button", class: "nav", "aria-label": "Next week" }, "\u203A");
  next.addEventListener("click", () => { weekStart.setDate(weekStart.getDate() + 7); renderCalendar(); });
  strip.appendChild(next);

  // month grid
  const month = document.getElementById("month");
  month.hidden = !monthOpen;
  document.getElementById("monthBtn").setAttribute("aria-expanded", String(monthOpen));
  document.getElementById("allBtn").setAttribute("aria-pressed", String(!selected));
  if (!monthOpen) return;

  document.getElementById("monthTitle").textContent =
    new Date(viewYear, viewMonth, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const atFirstMonth = viewYear === startDate().getFullYear() && viewMonth === startDate().getMonth();
  const pm = document.getElementById("prevM");
  pm.disabled = atFirstMonth;
  pm.style.opacity = atFirstMonth ? ".3" : "1";
  const g = document.getElementById("mgrid");
  g.textContent = "";
  ["S", "M", "T", "W", "T", "F", "S"].forEach(l => g.appendChild(el("div", { class: "dow", "aria-hidden": "true" }, l)));
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const count = new Date(viewYear, viewMonth + 1, 0).getDate();
  for (let i = 0; i < firstDow; i++) g.appendChild(el("div"));
  for (let n = 1; n <= count; n++) {
    const dt = new Date(viewYear, viewMonth, n);
    if (dt < startDate()) { g.appendChild(el("div")); continue; }
    const k = keyOf(dt);
    const has = !!map[k];
    const b = el("button", {
      type: "button", class: "m" + (has ? " has" : "") + (k === todayKey ? " today" : ""),
      "aria-pressed": String(selected === k),
      "aria-label": dt.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) + (has ? ", has words" : ", no words")
    }, String(n));
    b.addEventListener("click", () => pick(k, dt));
    g.appendChild(b);
  }
}

/* ---------- shared pieces ---------- */
function emptyBox() {
  const d = el("div", { class: "empty" });
  d.textContent = (selected && !daysByDate()[selected])
    ? "There are no words for this date. Pick a date with a green dot, or tap All days."
    : "No words yet.";
  return d;
}
function renderScope() {
  const s = document.getElementById("scope");
  s.textContent = "";
  const items = scope();
  if (selected) {
    const d = daysByDate()[selected];
    s.appendChild(el("span", null, d ? "Day " + d.day + " (" + dateFor(d.day) + ")" : "No words on this date"));
  } else {
    s.appendChild(el("span", null, "All days, " + items.length + " words"));
  }
  const fresh = items.filter(i => !get(i.id).seen).length;
  if (fresh > 0 && mode === "cards") s.appendChild(el("span", { class: "badge-new" }, fresh + " new"));
}
function setStatus(id, status) {
  const before = get(id).status;
  set(id, { status: status });
  if (before !== status) {
    if (status === "Learned") { confetti(70); toast("Learned! +10 points"); }
    else if (status === "Practicing") toast("Keep going! +5 points");
  }
}

/* ---------- flashcards ---------- */
function renderCards(p) {
  const items = scope();
  if (!items.length) { p.appendChild(emptyBox()); return; }

  if (deckIndex >= items.length) {
    const learned = items.filter(i => get(i.id).status === "Learned").length;
    const box = el("div", { class: "done" });
    box.appendChild(el("h3", null, "You finished the cards!"));
    box.appendChild(el("p", null, learned + " of " + items.length + " words marked as learned. Now test yourself in the quiz."));
    const row = el("div", { class: "controls" });
    const again = el("button", { type: "button", class: "btn" }, "Start again");
    again.addEventListener("click", () => { deckIndex = 0; flipped = false; renderPanel(); });
    const q = el("button", { type: "button", class: "btn primary" }, "Take the quiz");
    q.addEventListener("click", () => setMode("quiz"));
    row.appendChild(again); row.appendChild(q);
    box.appendChild(row);
    p.appendChild(box);
    return;
  }

  const it = items[deckIndex];
  const saved = get(it.id);

  const dots = el("div", { class: "dots", "aria-hidden": "true" });
  items.forEach((x, i) => {
    const st = get(x.id).status;
    dots.appendChild(el("i", { class: i === deckIndex ? "cur" : (st === "Learned" ? "l" : (st === "Practicing" ? "p" : "")) }));
  });
  p.appendChild(dots);

  const card = el("div", { class: "flip" + (flipped ? " flipped" : ""), role: "button", tabindex: "0", "data-status": saved.status, "aria-label": "Flashcard for " + it.w.word + ". Tap to flip." });
  const inner = el("div", { class: "inner" });

  const front = el("div", { class: "face front", "aria-hidden": String(flipped) });
  if (!saved.seen) front.appendChild(el("span", { class: "badge-pop" }, "NEW WORD"));
  front.appendChild(el("span", { class: "bigword" }, it.w.word));
  front.appendChild(el("span", { class: "ptype" }, it.w.type));
  front.appendChild(el("span", { class: "hint" }, "Do you know it? Tap to check"));

  const back = el("div", { class: "face back", "aria-hidden": String(!flipped) });
  [["Meaning", it.w.meaning, ""], ["Example", it.w.example, "eg"], ["At work", it.w.work, "eg"]].forEach(r => {
    const para = el("p");
    para.appendChild(el("b", null, r[0]));
    para.appendChild(el("span", r[2] ? { class: r[2] } : null, r[1]));
    back.appendChild(para);
  });

  inner.appendChild(front); inner.appendChild(back); card.appendChild(inner);

  function flip() {
    flipped = !flipped;
    card.classList.toggle("flipped", flipped);
    front.setAttribute("aria-hidden", String(flipped));
    back.setAttribute("aria-hidden", String(!flipped));
    if (flipped && !get(it.id).seen) { set(it.id, { seen: true }); renderStats(); renderScope(); }
    else touch();
  }
  card.addEventListener("click", flip);
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
  p.appendChild(card);

  const nav = el("div", { class: "controls" });
  const pv = el("button", { type: "button", class: "btn mini", "aria-label": "Previous card" }, "\u2039");
  pv.disabled = deckIndex === 0;
  pv.addEventListener("click", () => go(-1));
  const ls = el("button", { type: "button", class: "btn" }, "Listen");
  ls.addEventListener("click", () => { speak(it.w.word); touch(); });
  const nx = el("button", { type: "button", class: "btn mini", "aria-label": "Next card" }, "\u203A");
  nx.addEventListener("click", () => go(1));
  nav.appendChild(pv); nav.appendChild(ls); nav.appendChild(nx);
  p.appendChild(nav);

  const act = el("div", { class: "controls" });
  const again = el("button", { type: "button", class: "btn warn" }, "Still learning");
  again.addEventListener("click", () => { setStatus(it.id, "Practicing"); set(it.id, { seen: true }); go(1); });
  const know = el("button", { type: "button", class: "btn primary" }, "I know it");
  know.addEventListener("click", () => { setStatus(it.id, "Learned"); set(it.id, { seen: true }); go(1); });
  act.appendChild(again); act.appendChild(know);
  p.appendChild(act);
}
function go(step) {
  const n = scope().length;
  deckIndex = Math.max(0, Math.min(n, deckIndex + step));
  flipped = false;
  renderStats(); renderScope(); renderPanel();
}
document.addEventListener("keydown", e => {
  if (mode !== "cards") return;
  const t = e.target.tagName;
  if (t === "TEXTAREA" || t === "INPUT") return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});

/* ---------- quiz ---------- */
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function buildQuiz() {
  const items = shuffle(scope());
  const all = allWords();
  return items.map((it, idx) => {
    const re = new RegExp("\\b" + escapeRe(it.w.word) + "\\w*", "i");
    const blank = re.test(it.w.example) ? it.w.example.replace(re, "_____") : null;
    const useBlank = blank && idx % 2 === 1;
    const others = shuffle(all.filter(a => a.w.word !== it.w.word)).slice(0, 3);
    return {
      it: it,
      title: useBlank ? "Fill in the blank" : "Which word matches this meaning?",
      prompt: useBlank ? "\u201C" + blank + "\u201D" : "\u201C" + it.w.meaning + "\u201D",
      options: shuffle([it].concat(others)).map(o => o.w.word),
      answer: it.w.word
    };
  });
}
function renderQuiz(p) {
  const items = scope();
  if (!items.length) { p.appendChild(emptyBox()); return; }
  if (allWords().length < 2) { p.appendChild(el("div", { class: "empty" }, "Add at least 2 words to start a quiz.")); return; }

  if (!quiz) {
    const box = el("div", { class: "done" });
    box.appendChild(el("h3", null, "Ready for a quick quiz?"));
    box.appendChild(el("p", null, items.length + " questions. Pick the right word each time."));
    const row = el("div", { class: "controls" });
    const go1 = el("button", { type: "button", class: "btn primary" }, "Start quiz");
    go1.addEventListener("click", () => { quiz = { qs: buildQuiz(), i: 0, score: 0, picked: null }; touch(); renderPanel(); });
    row.appendChild(go1); box.appendChild(row); p.appendChild(box);
    return;
  }

  if (quiz.i >= quiz.qs.length) {
    const total = quiz.qs.length;
    const box = el("div", { class: "done" });
    const msg = quiz.score === total ? "Perfect score!" : (quiz.score >= total * 0.6 ? "Well done!" : "Good try!");
    box.appendChild(el("h3", null, msg));
    box.appendChild(el("p", null, "You got " + quiz.score + " out of " + total + (quiz.score === total ? ". Every word is in your head now." : ". Flip the cards again and try one more time.")));
    const row = el("div", { class: "controls" });
    const cards = el("button", { type: "button", class: "btn" }, "Back to cards");
    cards.addEventListener("click", () => { deckIndex = 0; flipped = false; setMode("cards"); });
    const retry = el("button", { type: "button", class: "btn primary" }, "Try again");
    retry.addEventListener("click", () => { quiz = { qs: buildQuiz(), i: 0, score: 0, picked: null }; renderPanel(); });
    row.appendChild(cards); row.appendChild(retry); box.appendChild(row); p.appendChild(box);
    if (quiz.score >= total * 0.6 && !quiz.celebrated) { quiz.celebrated = true; confetti(quiz.score === total ? 120 : 60); }
    return;
  }

  const q = quiz.qs[quiz.i];
  const box = el("div", { class: "q" });
  box.appendChild(el("small", null, "Question " + (quiz.i + 1) + " of " + quiz.qs.length));
  box.appendChild(el("h3", null, q.title));
  box.appendChild(el("p", { class: "eg" }, q.prompt));

  const opts = el("div", { class: "opts" });
  q.options.forEach(o => {
    const b = el("button", { type: "button", class: "opt" }, o);
    if (quiz.picked) {
      b.disabled = true;
      if (o === q.answer) b.classList.add("right");
      else if (o === quiz.picked) b.classList.add("wrong");
    }
    b.addEventListener("click", () => {
      if (quiz.picked) return;
      quiz.picked = o;
      if (o === q.answer) quiz.score++;
      touch();
      renderPanel();
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);

  if (quiz.picked) {
    const ok = quiz.picked === q.answer;
    box.appendChild(el("p", { class: "fb " + (ok ? "ok" : "no") }, ok ? "Correct!" : "Not this time. The answer is " + q.answer + "."));
    const row = el("div", { class: "controls" });
    const ls = el("button", { type: "button", class: "btn" }, "Listen");
    ls.addEventListener("click", () => speak(q.answer));
    const nx = el("button", { type: "button", class: "btn primary" }, quiz.i + 1 === quiz.qs.length ? "See my score" : "Next question");
    nx.addEventListener("click", () => { quiz.i++; quiz.picked = null; renderPanel(); });
    row.appendChild(ls); row.appendChild(nx); box.appendChild(row);
  }
  p.appendChild(box);
}

/* ---------- list ---------- */
function renderList(p) {
  const tools = el("div", { class: "lt" });
  const s = el("input", { type: "search", placeholder: "Search a word or meaning", "aria-label": "Search words" });
  s.value = query;
  tools.appendChild(s);
  const chips = el("div", { class: "chips", role: "group", "aria-label": "Filter by status" });
  ["All", "New", "Practicing", "Learned"].forEach(f => {
    const b = el("button", { type: "button", class: "pill", "aria-pressed": String(filter === f) }, f);
    b.addEventListener("click", () => {
      filter = f;
      chips.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.textContent === f)));
      fill();
    });
    chips.appendChild(b);
  });
  tools.appendChild(chips);
  p.appendChild(tools);
  const body = el("div");
  p.appendChild(body);
  s.addEventListener("input", () => { query = s.value.trim().toLowerCase(); fill(); });

  function fill() {
    body.textContent = "";
    let shown = 0;
    scope().slice().sort((a, b) => b.day - a.day).forEach(it => {
      const saved = get(it.id);
      if (filter !== "All" && saved.status !== filter) return;
      if (query) {
        const hay = (it.w.word + " " + it.w.meaning + " " + it.w.example + " " + it.w.work + " " + saved.mine).toLowerCase();
        if (hay.indexOf(query) === -1) return;
      }
      shown++;
      const card = el("article", { class: "word", "data-status": saved.status });
      const top = el("div", { class: "top" });
      const title = el("div");
      title.appendChild(el("span", { class: "w" }, it.w.word));
      title.appendChild(el("span", { class: "type" }, it.w.type));
      const say = el("button", { type: "button", class: "say", "aria-label": "Hear " + it.w.word }, "Listen");
      say.addEventListener("click", () => speak(it.w.word));
      top.appendChild(title); top.appendChild(say); card.appendChild(top);

      const detail = el("div", { class: "detail" });
      [["Meaning", it.w.meaning, ""], ["Example", it.w.example, "eg"], ["At work", it.w.work, "eg"]].forEach(r => {
        const para = el("p");
        para.appendChild(el("b", null, r[0]));
        para.appendChild(el("span", r[2] ? { class: r[2] } : null, r[1]));
        detail.appendChild(para);
      });
      card.appendChild(detail);

      const lab = el("label", { class: "mine", for: "m-" + it.id }, "My own sentence");
      const ta = el("textarea", { id: "m-" + it.id, placeholder: "Write a sentence with this word" });
      ta.value = saved.mine;
      ta.addEventListener("input", () => { set(it.id, { mine: ta.value }); renderStats(); });
      card.appendChild(lab); card.appendChild(ta);

      const st = el("div", { class: "status", role: "group", "aria-label": "Status for " + it.w.word });
      ["New", "Practicing", "Learned"].forEach(name => {
        const b = el("button", { type: "button", "aria-pressed": String(saved.status === name) }, name);
        b.addEventListener("click", () => {
          setStatus(it.id, name);
          card.dataset.status = name;
          st.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.textContent === name)));
          renderStats();
          if (filter !== "All" && filter !== name) fill();
        });
        st.appendChild(b);
      });
      card.appendChild(st);
      body.appendChild(card);
    });
    if (!shown) body.appendChild(selected && !daysByDate()[selected] ? emptyBox() : el("div", { class: "empty" }, "No words match. Try a different search or filter."));
  }
  fill();
}

/* ---------- main render ---------- */
function renderPanel() {
  const p = document.getElementById("panel");
  p.textContent = "";
  if (mode === "cards") renderCards(p);
  else if (mode === "quiz") renderQuiz(p);
  else renderList(p);
}
function renderAll() {
  renderStats();
  renderCalendar();
  renderScope();
  renderPanel();
}
function setMode(m) {
  mode = m;
  if (m === "quiz") quiz = null;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  renderScope();
  renderPanel();
}

/* ---------- controls ---------- */
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.getElementById("allBtn").addEventListener("click", () => {
  selected = null; deckIndex = 0; flipped = false; quiz = null; renderAll();
});
document.getElementById("monthBtn").addEventListener("click", () => {
  monthOpen = !monthOpen;
  if (monthOpen) { const mid = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 3); viewYear = mid.getFullYear(); viewMonth = mid.getMonth(); }
  renderCalendar();
});
document.getElementById("prevM").addEventListener("click", () => {
  if (viewYear === startDate().getFullYear() && viewMonth <= startDate().getMonth()) return;
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
});
document.getElementById("nextM").addEventListener("click", () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

renderAll();
</script>
</body>
